name: Publish signed desktop updates
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # Tag and manual runs must not update the shared release manifest concurrently.
  group: signed-desktop-release
  cancel-in-progress: false
jobs:
  release:
    strategy:
      fail-fast: false
      # Each platform merges its entry into latest.json; serialize that shared asset.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
          - os: ubuntu-24.04
            args: --bundles appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macOS cross architecture targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - run: npm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Prepare universal macOS CLI binary
        if: runner.os == 'macOS'
        # Tauri combines the GUI binary; its extra Cargo binary also needs lipo.
        run: |
          cargo build --release --locked --manifest-path src-tauri/Cargo.toml --bin monitor-cli --target aarch64-apple-darwin
          cargo build --release --locked --manifest-path src-tauri/Cargo.toml --bin monitor-cli --target x86_64-apple-darwin
          mkdir -p src-tauri/target/universal-apple-darwin/release
          lipo -create src-tauri/target/aarch64-apple-darwin/release/monitor-cli src-tauri/target/x86_64-apple-darwin/release/monitor-cli -output src-tauri/target/universal-apple-darwin/release/monitor-cli
      - name: Read release notes
        id: notes
        run: node -e "const fs=require('fs'); const v=require('./package.json').version; fs.appendFileSync(process.env.GITHUB_OUTPUT,'body<<GITORBIT_NOTES\n'+fs.readFileSync('docs/releases/'+v+'.md','utf8')+'\nGITORBIT_NOTES\n')"
      - name: Build and publish signed packages
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: GitOrbit __VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
      - name: Verify Windows installation migration
        if: runner.os == 'Windows'
        run: ./scripts/test-installer-migration.ps1
  publish:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify all signed platform entries and publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/finalize-release.mjs
